name: Publish release archives

on:
  workflow_run:
    workflows:
      - Create release tag
    types:
      - completed

concurrency:
  group: skills-parallel-ai-deploy
  cancel-in-progress: false

jobs:
  publish-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      release_sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Read release reference from tag workflow
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve release version and commit
        id: version
        run: |
          version=$(tr -d '\n' < "$RUNNER_TEMP/release-metadata/VERSION")
          sha=$(tr -d '\n' < "$RUNNER_TEMP/release-metadata/COMMIT")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.sha }}
          fetch-depth: 0

      - name: Verify immutable release checkout
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          test "$(tr -d '\n' < VERSION)" = "$RELEASE_VERSION"
          test "$(git rev-parse "refs/tags/v$RELEASE_VERSION^{commit}")" = "$RELEASE_SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release archives
        run: |
          pnpm run build:archives -- --version "${{ steps.version.outputs.version }}" --output release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          overwrite_files: true
          files: release-assets/*.zip

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: main-repo

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies in main checkout
        working-directory: main-repo
        run: pnpm install --frozen-lockfile

      - name: Rebuild CDN site from main
        working-directory: main-repo
        run: pnpm build

      - name: Deploy refreshed CDN metadata
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: main-repo

  publish-clawhub:
    needs: publish-release
    if: vars.CLAWHUB_OWNER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-release.outputs.release_sha }}
          fetch-depth: 0
          path: clawhub-release

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install publishing tools
        run: pnpm install --frozen-lockfile

      - name: Publish all skills at the repository release version
        env:
          CLAWHUB_OWNER: ${{ vars.CLAWHUB_OWNER }}
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_DISABLE_TELEMETRY: "1"
        run: pnpm run release:clawhub -- --root clawhub-release
