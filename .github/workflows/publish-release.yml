name: Publish release archives

on:
  push:
    tags:
      - "v*"

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release archives
        run: |
          version="${GITHUB_REF_NAME#v}"
          pnpm run build:archives -- --version "$version" --output release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: release-assets/*.zip

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: main-repo

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies in main checkout
        working-directory: main-repo
        run: pnpm install --frozen-lockfile

      - name: Rebuild CDN site from main
        working-directory: main-repo
        run: pnpm build

      - name: Deploy refreshed CDN metadata
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.62.0"
          workingDirectory: main-repo
