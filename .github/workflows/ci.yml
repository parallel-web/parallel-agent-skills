name: Validate PR

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python3 -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Validate CDN site build
        run: python3 scripts/skills_cdn.py build-site --output dist

      - name: Validate release archive build
        run: |
          version=$(tr -d '\n' < VERSION)
          python3 scripts/skills_cdn.py build-archives --version "$version" --output release-assets
