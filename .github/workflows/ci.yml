name: Validate PR

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install released Parallel CLI
        run: python3 -m pip install parallel-web-tools

      - name: Install pre-commit
        run: python3 -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run Python tests
        run: python3 -m unittest discover -s tests

      - name: Validate CDN site build
        run: pnpm build

      - name: Validate release archive build
        run: |
          version=$(tr -d '\n' < VERSION)
          pnpm run build:archives -- --version "$version" --output release-assets
