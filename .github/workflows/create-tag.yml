name: Create release tag

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  tag-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          version=$(tr -d '\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
          else
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

          mkdir -p "$RUNNER_TEMP/release-metadata"
          git show "$tag:VERSION" > "$RUNNER_TEMP/release-metadata/VERSION"
          git rev-parse "$tag^{commit}" > "$RUNNER_TEMP/release-metadata/COMMIT"

      - name: Save immutable release reference
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata/
          overwrite: true
          if-no-files-found: error
